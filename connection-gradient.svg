<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="400" viewBox="0 0 1232 400">
  <title>Connection · Gradiente cromado retrô (ciano → azul → violeta → magenta)</title>
  <defs>
    <!-- Gradiente principal: topo ciano claro, brilho, corte seco (linha de horizonte cromada), azul profundo → violeta → magenta -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#E9FBFF"/>
      <stop offset="0.10" stop-color="#3FCFFC"/>
      <stop offset="0.28" stop-color="#06B7FC"/>
      <stop offset="0.44" stop-color="#9CDAFC"/>
      <stop offset="0.48" stop-color="#E6F7FF"/>
      <stop offset="0.485" stop-color="#1D5BFF"/>
      <stop offset="0.62" stop-color="#0338FD"/>
      <stop offset="0.76" stop-color="#6A1FF2"/>
      <stop offset="0.90" stop-color="#E02BD0"/>
      <stop offset="1"    stop-color="#FF3FA8"/>
    </linearGradient>

    <!-- Versão suave, sem corte, para fundos e botões -->
    <linearGradient id="chromeSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3FCFFC"/>
      <stop offset="0.35" stop-color="#0A8CFF"/>
      <stop offset="0.65" stop-color="#4A22F5"/>
      <stop offset="1"    stop-color="#FF2BD0"/>
    </linearGradient>

    <!-- Horizontal: ciano → rosa (setas, barras, bordas) -->
    <linearGradient id="horizontal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06D6FF"/>
      <stop offset="0.5" stop-color="#2C5CFF"/>
      <stop offset="1" stop-color="#FF2BD0"/>
    </linearGradient>

    <!-- Script rosa (estilo "2027") -->
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7CE8"/>
      <stop offset="0.5" stop-color="#FF2BD0"/>
      <stop offset="1" stop-color="#C2169F"/>
    </linearGradient>

    <!-- Seta play ciano -->
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D6BFF"/>
      <stop offset="0.6" stop-color="#18B8FF"/>
      <stop offset="1" stop-color="#9FFAFF"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
      <feFlood flood-color="#1CB8FF" flood-opacity="0.85"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1232" height="400" fill="#EAEAEB"/>

  <!-- Prévia: logo com contorno marinho, borda branca e gradiente cromado -->
  <g font-family="'Exo 2','Saira','Arial Black',sans-serif" font-weight="900" font-style="italic" font-size="190" letter-spacing="-4">
    <text x="40" y="190" fill="#050F4A" stroke="#050F4A" stroke-width="22" stroke-linejoin="round">CONNECTION</text>
    <text x="40" y="190" fill="url(#chrome)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" paint-order="stroke" filter="url(#glow)">CONNECTION</text>
  </g>

  <!-- Prévia: seta e script rosa -->
  <g transform="translate(1040 40)" filter="url(#glow)">
    <path d="M0 0 L70 70 L0 140 Z" fill="url(#arrow)" stroke="#050F4A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M70 0 L140 70 L70 140 Z" fill="url(#arrow)" stroke="#050F4A" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Amostras dos gradientes -->
  <g transform="translate(40 250)">
    <rect width="260" height="120" rx="14" fill="url(#chrome)"/>
    <rect x="290" width="260" height="120" rx="14" fill="url(#chromeSoft)"/>
    <rect x="580" width="260" height="120" rx="14" fill="url(#horizontal)"/>
    <rect x="870" width="260" height="120" rx="14" fill="url(#pink)"/>
  </g>
</svg>
