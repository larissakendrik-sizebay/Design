<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="400" viewBox="0 0 1232 400">
  <title>Connection · Gradiente cromado retrô (direção da referência)</title>
  <defs>
    <!-- Metade de cima: ciano → azul-céu claro até a linha de brilho. Metade de baixo: azul royal → violeta → magenta.
         Levemente inclinado (x1→x2) para o rosa crescer mais à direita, como na referência. -->
    <linearGradient id="chrome" x1="0.46" y1="0" x2="0.54" y2="1">
      <stop offset="0"     stop-color="#1DB9FC"/>
      <stop offset="0.22"  stop-color="#3FCFFC"/>
      <stop offset="0.40"  stop-color="#6FC6FD"/>
      <stop offset="0.465" stop-color="#9CDAFC"/>
      <stop offset="0.48"  stop-color="#F2FBFF"/>
      <stop offset="0.49"  stop-color="#1E55FF"/>
      <stop offset="0.60"  stop-color="#2F3CFA"/>
      <stop offset="0.72"  stop-color="#7A2BF0"/>
      <stop offset="0.86"  stop-color="#E21FD0"/>
      <stop offset="1"     stop-color="#FF2BB8"/>
    </linearGradient>

    <!-- Rosa extra que aumenta da esquerda para a direita, só na metade de baixo -->
    <linearGradient id="pinkShift" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FF2BD0" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FF2BD0" stop-opacity="0.35"/>
      <stop offset="1"    stop-color="#FF2BD0" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="lowerMaskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.48" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="lowerMask" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox" x="0" y="0" width="1" height="1">
      <rect width="1" height="1" fill="url(#lowerMaskGrad)"/>
    </mask>

    <!-- Versão suave (sem o corte), mesma direção -->
    <linearGradient id="chromeSoft" x1="0.46" y1="0" x2="0.54" y2="1">
      <stop offset="0"    stop-color="#1DB9FC"/>
      <stop offset="0.45" stop-color="#3F6BFF"/>
      <stop offset="0.7"  stop-color="#7A2BF0"/>
      <stop offset="1"    stop-color="#FF2BB8"/>
    </linearGradient>

    <linearGradient id="horizontal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1DB9FC"/>
      <stop offset="0.5" stop-color="#7A2BF0"/>
      <stop offset="1" stop-color="#FF2BB8"/>
    </linearGradient>

    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7CE8"/>
      <stop offset="0.5" stop-color="#FF2BD0"/>
      <stop offset="1" stop-color="#C2169F"/>
    </linearGradient>

    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D6BFF"/>
      <stop offset="0.6" stop-color="#18B8FF"/>
      <stop offset="1" stop-color="#9FFAFF"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
      <feFlood flood-color="#1CB8FF" flood-opacity="0.85"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1232" height="400" fill="#EAEAEB"/>

  <g font-family="'Exo 2','Saira','Arial Black',sans-serif" font-weight="900" font-style="italic" font-size="190" letter-spacing="-4">
    <text x="40" y="190" fill="#050F4A" stroke="#050F4A" stroke-width="22" stroke-linejoin="round">CONNECTION</text>
    <text x="40" y="190" fill="url(#chrome)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" paint-order="stroke" filter="url(#glow)">CONNECTION</text>
    <text x="40" y="190" fill="url(#pinkShift)" mask="url(#lowerMask)">CONNECTION</text>
  </g>

  <g transform="translate(1040 40)" filter="url(#glow)">
    <path d="M0 0 L70 70 L0 140 Z" fill="url(#arrow)" stroke="#050F4A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M70 0 L140 70 L70 140 Z" fill="url(#arrow)" stroke="#050F4A" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <g transform="translate(40 250)">
    <rect width="260" height="120" rx="14" fill="url(#chrome)"/>
    <rect x="290" width="260" height="120" rx="14" fill="url(#chromeSoft)"/>
    <rect x="580" width="260" height="120" rx="14" fill="url(#horizontal)"/>
    <rect x="870" width="260" height="120" rx="14" fill="url(#pink)"/>
  </g>
</svg>
